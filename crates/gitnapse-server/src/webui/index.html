<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitNapse Web</title>
<style>
  :root { --bg:#050505; --fg:#f7f1ff; --accent:#fc618d; --muted:#69676c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui, sans-serif; }
  header { padding:1rem 1.5rem; border-bottom:1px solid var(--muted);
           display:flex; gap:1rem; align-items:center; }
  header h1 { font-size:1.1rem; margin:0; color:var(--accent); }
  #status { color:var(--muted); }
  main { padding:1.5rem; max-width:900px; margin:0 auto; }
  input[type=search] { flex:1; padding:.5rem .75rem; border:1px solid var(--muted);
                       background:transparent; color:var(--fg); border-radius:6px; }
  button { padding:.5rem 1rem; border:0; border-radius:6px;
           background:var(--accent); color:#000; font-weight:600; cursor:pointer; }
  ul { list-style:none; padding:0; }
  li { padding:.75rem .5rem; border-bottom:1px solid #222; }
  li .repo { font-weight:600; color:var(--fg); }
  li .lang, li .stars { color:var(--muted); font-size:.85rem; }
  .desc { color:var(--muted); font-size:.85rem; margin-top:.25rem; }
  #error { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>GitNapse Web</h1>
  <input id="q" type="search" placeholder="Search repositories…" value="gitnapse" />
  <button id="go">Search</button>
  <span id="status">checking…</span>
</header>
<main>
  <div id="error"></div>
  <ul id="results"></ul>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  async function health() {
    try {
      const r = await fetch('/health');
      const j = await r.json();
      $('status').textContent = `API ${j.status} · v${j.version}`;
    } catch { $('status').textContent = 'API offline'; }
  }
  async function search() {
    const q = $('q').value.trim() || 'gitnapse';
    $('results').innerHTML = '';
    $('error').textContent = '';
    try {
      const r = await fetch(`/api/v1/search?q=${encodeURIComponent(q)}&per_page=20`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const repos = await r.json();
      if (!repos.length) { $('results').innerHTML = '<li>No results.</li>'; return; }
      for (const repo of repos) {
        const li = document.createElement('li');
        li.innerHTML = `<span class="repo">${repo.full_name}</span>
          <span class="lang">${repo.language || ''}</span>
          <span class="stars">★ ${repo.stargazers_count}</span>
          <div class="desc">${repo.description || ''}</div>`;
        $('results').appendChild(li);
      }
    } catch (e) { $('error').textContent = 'Search failed: ' + e.message; }
  }
  $('go').addEventListener('click', search);
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') search(); });
  health();
  search();
</script>
</body>
</html>
